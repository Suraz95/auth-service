name: CI/CD Pipeline for Auth Service

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    environment: micro-service
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Node.js with caching
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: "npm"

      # Step 3: Determine Cache Directory (Node Modules)
      - name: Determine Cache Directory
        id: npm-cache-dir
        run: echo "dir=node_modules" >> $GITHUB_ENV

      # Step 4: Cache Node Modules
      - name: Cache Node Modules
        uses: actions/cache@v4
        id: npm-cache
        with:
          path: ${{ env.dir }}  # Correctly referencing the directory to cache
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
        env:
          dir: node_modules

      # Step 5: Install dependencies (only if cache miss)
      - name: Install dependencies
        if: steps.npm-cache.outputs.cache-hit != 'true'
        run: npm install

      # Step 6: Build the project
      - name: Build project
        run: npm run build --if-present

      # Step 7: Docker login
      - name: Docker Login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Step 8: Build and tag Docker image for auth-service
      - name: Build and tag Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/c-compiler-auth:latest .

      # Step 9: Push Docker image to Docker Hub
      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/c-compiler-auth:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      # Step 1: Deploy Auth Service (if applicable)
      - name: Deploy Auth Service
        run: |
          echo "Deploying Auth Service..."
    env:
      PORT: ${{ secrets.AUTH_SERVICE_PORT }}
      MONGO_DB_URL: ${{ secrets.MONGO_DB_URL }}
      FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
