name: CI/CD Pipeline for Auth Service

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    environment: micro-service
    runs-on: ubuntu-latest

    steps:
      # Checkout code from the repo
      - name: Checkout code
        uses: actions/checkout@v2

      # Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '20'

      # Install dependencies
      - name: Install dependencies
        run: npm install

      # Build the project
      - name: Build project
        run: npm run build

      # Docker login
      - name: Docker Login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Build Docker image for Auth Service
      - name: Build Docker image for auth-service
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/c-compiler-auth:latest .

      # Push Docker image to Docker Hub
      - name: Push Docker image for auth-service
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/c-compiler-auth:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy Auth Service (If applicable)
        run: |
          # Add your deploy commands here
          echo "Deploying Auth Service..."

  # Set environment variables for Auth Service deployment from GitHub Secrets
  env:
    PORT: ${{ secrets.AUTH_SERVICE_PORT }}
    MONGO_DB_URL: ${{ secrets.MONGO_DB_URL }}
    FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
    JWT_SECRET: ${{ secrets.JWT_SECRET }}
